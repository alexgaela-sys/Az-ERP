name: Regenerate bun.lock (one-off)

on:
  workflow_dispatch: {}

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate lockfile against current package.json
        run: bun install --no-frozen-lockfile

      - name: Commit and push bun.lock if changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Regenerate bun.lock for the new Electron desktop dependencies"
          git push
