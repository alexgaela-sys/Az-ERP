  <body class="bg-cream-100 text-ink-900 font-sans antialiased selection:bg-brand-500 selection:text-white">
    <!-- Fix 5 (speed-fix list): static, CSS-only placeholder so the user
         never sees a blank page before React mounts. React's createRoot
         render() replaces everything inside #root, so this markup is
         purely temporary and never conflicts with the app. -->
    <div id="root">
      <div class="min-h-screen bg-cream-100 flex items-center justify-center p-6" dir="rtl">
        <div class="w-full max-w-5xl space-y-4">
          <div class="h-8 w-48 rounded-lg bg-cream-200" style="animation: yz-pulse 1.5s ease-in-out infinite"></div>
          <div class="bg-white rounded-2xl border border-cream-200" style="overflow:hidden">
            <div class="h-10 bg-cream-100" style="animation: yz-pulse 1.5s ease-in-out infinite"></div>
            <div style="border-top:1px solid #efe8dc">
              <div class="h-11" style="animation: yz-pulse 1.5s ease-in-out infinite; animation-delay:.1s"></div>
              <div class="h-11" style="animation: yz-pulse 1.5s ease-in-out infinite; animation-delay:.2s; border-top:1px solid #f6f1e8"></div>
              <div class="h-11" style="animation: yz-pulse 1.5s ease-in-out infinite; animation-delay:.3s; border-top:1px solid #f6f1e8"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <style>
      /* Minimal inline fallback in case the compiled stylesheet hasn't
         painted yet (e.g. first dev-server load) — plain CSS, no Tailwind
         dependency, so this always works regardless of load order. */
      @keyframes yz-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the safe PWA service worker (installability only; no ERP data caching)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* SW is optional */ });
        });
      }
    </script>
  </body>
</html>
